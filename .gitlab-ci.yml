image: node:24.21.0-slim

services:
  - docker:dind

stages:
  - build
  - prepare_test
  - deploy_test
  - check_test
  - prepare_prod
  - deploy_prod
  - check_prod

build_job:
  stage: build
  image: docker:27.4.0
  variables:
    CI_DEBUG_TRACE: "true"
  script:
    - docker compose -f compose-ci.yml up --abort-on-container-exit --exit-code-from app
  artifacts:
    when: always
    paths:
      - reports/

migrate_test_job:
  stage: prepare_test
  image: docker:27.4.0
  script:
    - docker run -v ${PWD}/db:/flyway/sql --rm flyway/flyway -mixed=true -url=$TEST_DB_URL -user=$TEST_DB_USER -password=$TEST_DB_PASS migrate
  only:
    - jujuy-test

deploy_test_job:
  stage: deploy_test
  image: alpine:3.24.1
  script:
    - apk add curl
    - curl --fail --show-error --silent "$TEST_DEPLOY_URL?$TEST_DEPLOY_PARAMS"
  dependencies:
    - migrate_test_job
  only:
    - jujuy-test

migrate_prod_job:
  stage: prepare_prod
  image: docker:27.4.0
  script:
    - docker run -v ${PWD}/db:/flyway/sql --rm flyway/flyway -mixed=true -url=$PROD_DB_URL -user=$PROD_DB_USER -password=$PROD_DB_PASS migrate
  only:
    - jujuy-prod

deploy_prod_job:
  stage: deploy_prod
  image: alpine:3.24.1
  script:
    - apk add curl
    - curl --fail --show-error --silent "$PROD_DEPLOY_URL?$PROD_DEPLOY_PARAMS"
  dependencies:
    - migrate_prod_job
  only:
    - jujuy-prod
