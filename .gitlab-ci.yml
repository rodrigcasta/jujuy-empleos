image: node:22.13.1-slim

services:
  - postgres:14.4

variables:
  POSTGRES_DB: mydb
  POSTGRES_USER: pguser
  POSTGRES_PASSWORD: example
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432

stages:
  - build
  - deploy_test
  - deploy_prod

build_job:
  stage: build
  script:
    ./build.sh

deploy_test_job:
  stage: deploy_test
  image: alpine/curl
  script:
    - curl $DEPLOY_TEST_HOOK
  only:
    - test

deploy_prod_job:
  stage: deploy_prod
  image: alpine/curl
  script:
    - curl $DEPLOY_PROD_HOOK
  only:
    - prod
