image: node:22.13.1-slim

services:
  - docker:dind

stages:
  - build
  - deploy_test
  - deploy_prod

build_job:
  stage: build
  image: docker:27.4.0
  variables:
    CI_DEBUG_TRACE: "true"
  script:
    - docker compose -f compose-ci.yml up --abort-on-container-exit --exit-code-from app
  artifacts:
      when: always
      paths:
        - reports/
