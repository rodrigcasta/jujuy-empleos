image: node:24.21.0-slim

services:
  - docker:dind

stages:
  - build
  - deploy_test
  - deploy_prod

build_job:
  stage: build
  image: docker:27.4.0
  variables:
    CI_DEBUG_TRACE: "true"
  script:
    - docker compose -f compose-ci.yml up --abort-on-container-exit --exit-code-from app
  artifacts:
      when: always
      paths:
        - reports/
  only:
    - test 
migrate_test_job:
  stage: deploy_test
  image: docker:27.4.0
  script:
    - docker run -v ${PWD}/db:/flyway/sql --rm flyway/flyway -mixed=true -url=$DB_URL -user=$DB_USER -password=$DB_PASS migrate

deploy_test_job:
  stage: deploy_test
  script:
    - curl --fail --show-error --silent "$TEST_DEPLOY_TEST_URL?$TEST_DEPLOY_TEST_PARAMS"
  dependencies:
    - migrate_test_job

deploy_prod_job:
  stage: deploy_prod
  script:
    - curl --fail --show-error --silent "$PROD_DEPLOY_PROD_URL?$PROD_DEPLOY_PROD_PARAMS"
  only:
    - prod
