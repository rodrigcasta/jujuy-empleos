services:
  test_db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - 5432:5432

  flyway-test:
    image: flyway/flyway:latest
    entrypoint: [""]
    # El contenedor sigue corriendo después de migrar porque --abort-on-container-exit detiene todo cuando
    # termina cualquier contenedor. El archivo /tmp/migraciones-aplicadas indica que terminó de migrar.
    command: ["sh", "-c", "flyway -url=jdbc:postgresql://test_db:5432/postgres -user=postgres -password=example -baselineOnMigrate=true -connectRetries=60 migrate && touch /tmp/migraciones-aplicadas && tail -f /dev/null"]
    volumes:
      - ./db:/flyway/sql
    depends_on:
      - test_db
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/migraciones-aplicadas"]
      interval: 2s
      timeout: 2s
      retries: 90

  app:
    environment:
      POSTGRES_HOST: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
    image: node:22.13.1-slim
    # command: "/bin/bash"
    #stdin_open: true # docker run -i
    #tty: true        # 
    command: "/app/run_ci.sh"
    volumes:
        - .:/app
    # Las pruebas necesitan que las migraciones estén aplicadas
    depends_on:
      flyway-test:
        condition: service_healthy
